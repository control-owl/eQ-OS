name: Release eQ-OS ISO

on:
  workflow_run:
    workflows: [ "Verify GPG Signature" ]
    types: [ completed ]
    branches: [ "stable" ]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  APP_NAME: eQ-OS
  VERSION_FILE: CHANGELOG
  OUTPUT_DIR: /workspace/ISO
  ISO_FILE: eQ-OS.raw
  SHA_FILE: eQ-OS.SHA256SUMS

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mkosi container
        run: |
          docker build -t mkosi-builder ${{ github.workspace }}

      - name: Run mkosi inside privileged container
        run: |
          mkdir -p ${{ github.workspace }}/ISO
          mkdir -p ${{ github.workspace }}/mkosi.builddir
          docker run --privileged \
            --tmpfs /work:rw,exec,size=4G \
            --tmpfs /var/tmp:rw,exec,size=4G \
            -v ${{ github.workspace }}/ISO:/workspace/ISO \
            -v ${{ github.workspace }}/mkosi.builddir:/workspace/mkosi.builddir \
            mkosi-builder \
            bash -c '
              cd /workspace
              if [ ! -f mkosi.key ]; then mkosi genkey; fi
              mkosi build

              echo "DEBUG: LIST ROOT"
              ls -al /

              echo "DEBUG: LIST /workspace"
              ls -al /workspace

              echo "DEBUG: LIST /workspace/mkosi.builddir"
              ls -al /workspace/mkosi.builddir || true

              echo "DEBUG: LIST /workspace/mkosi.builddir/output"
              ls -al /workspace/mkosi.builddir/output || true

              echo "DEBUG: LIST /workspace/mkosi.builddir/staging"
              ls -al /workspace/mkosi.builddir/staging || true

              echo "DEBUG: LIST /var/tmp"
              ls -al /var/tmp || true

              echo "DEBUG: LIST /var/tmp/mkosi-workspace*"
              ls -al /var/tmp/mkosi-workspace* 2>/dev/null || true

              echo "DEBUG: LIST /workspace/ISO BEFORE COPY"
              ls -al /workspace/ISO || true


              echo "DEBUG: TRY COPY FROM mkosi.builddir ROOT"
              cp -v /workspace/mkosi.builddir/eQ-OS.raw /workspace/ISO/ 2>/dev/null || echo "not here"
              cp -v /workspace/mkosi.builddir/eQ-OS.SHA256SUMS /workspace/ISO/ 2>/dev/null || echo "not here"

              echo "DEBUG: TRY COPY FROM mkosi.builddir/output"
              cp -v /workspace/mkosi.builddir/output/eQ-OS.raw /workspace/ISO/ 2>/dev/null || echo "not here"
              cp -v /workspace/mkosi.builddir/output/eQ-OS.SHA256SUMS /workspace/ISO/ 2>/dev/null || echo "not here"

              echo "DEBUG: TRY COPY FROM mkosi.builddir/staging"
              cp -v /workspace/mkosi.builddir/staging/eQ-OS.raw /workspace/ISO/ 2>/dev/null || echo "not here"
              cp -v /workspace/mkosi.builddir/staging/eQ-OS.SHA256SUMS /workspace/ISO/ 2>/dev/null || echo "not here"

              echo "DEBUG: TRY COPY FROM /var/tmp/mkosi-workspace*/staging"
              cp -v /var/tmp/mkosi-workspace*/staging/eQ-OS.raw /workspace/ISO/ 2>/dev/null || echo "not here"
              cp -v /var/tmp/mkosi-workspace*/staging/eQ-OS.SHA256SUMS /workspace/ISO/ 2>/dev/null || echo "not here"

              echo "DEBUG: LIST /workspace/ISO AFTER COPY"
              ls -al /workspace/ISO || true

            '

      - name: Extract version number
        run: |
          VERSION_NUMBER=$(head -n 1 ${{ env.VERSION_FILE }} | cut -d ':' -f 2- | tr -d ' #version')

          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: VERSION_NUMBER is not in valid format: ${VERSION_NUMBER}"
            exit 1
          fi

          echo "VERSION_NUMBER=${VERSION_NUMBER}" >> $GITHUB_ENV
          echo "VERSION=v${VERSION_NUMBER}" >> $GITHUB_ENV

      - name: Create signed tag
        run: |
          git config user.name "${{ env.APP_NAME }}"
          git config user.email "${{ secrets.ACTIONS_EMAIL }}"

          echo "Checking if tag ${{ env.VERSION }} exists..."

          if [ -n "$(git ls-remote --tags origin "${{ env.VERSION }}")" ]; then
            echo "Tag ${{ env.VERSION }} already exists on remote, skipping."
          else
            echo "Creating signed tag ${{ env.VERSION }}"
            git tag -a "${{ env.VERSION }}" -m "Release ${{ env.VERSION }}"
            git push origin "${{ env.VERSION }}"
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/${{ env.ISO_FILE }}
            ${{ env.OUTPUT_DIR }}/${{ env.SHA_FILE }}
            CHANGELOG
            LICENSE
          draft: false
          prerelease: true
          tag_name: v${{ env.VERSION_NUMBER }}
          name: "eQ-OS v${{ env.VERSION_NUMBER }}"
          body: |
            eQ-OS release build

            **Image:** ${{ env.ISO_FILE }}
            **Format:** RAW (bootable GPT disk image)
